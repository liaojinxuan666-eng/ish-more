name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux build / ${{ matrix.kernel }} / ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
        kernel: [ish, linux]
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gcc libarchive-dev libsqlite3-dev flex bison bc libelf-dev libssl-dev
          python -m pip install --upgrade meson ninja

      - name: Fetch Linux kernel sources
        if: matrix.kernel == 'linux'
        run: deps/clone-linux.sh

      - name: Configure and build
        env:
          CC: ${{ matrix.cc }}
        run: |
          meson setup build -Dengine=asbestos -Dkernel=${{ matrix.kernel }}
          ninja -C build

      - name: Run emulator tests
        if: matrix.kernel == 'ish'
        run: ninja -C build test

  build-ios:
    name: Build iOS app and unsigned IPA
    uses: ./.github/workflows/ios-build.yml
